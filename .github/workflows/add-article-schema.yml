name: Add Article schema to guides
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add schema
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, html
          from datetime import date
          BASE = "https://www.reseller-fee-calculator.com"
          pages = {"reseller-tax-guide.html": "reseller-tax-guide", "marketplace-fee-guide.html": "marketplace-fee-guide"}
          today = date.today().isoformat()
          for f, slug in pages.items():
              h = open(f, encoding="utf-8").read()
              if '"@type":"Article"' in h:
                  print("already has Article:", f); continue
              title = html.unescape(re.search(r"<title>(.*?)</title>", h).group(1))
              desc = html.unescape(re.search(r'name="description" content="([^"]*)"', h).group(1))
              org = {"@type": "Organization", "name": "Reseller Fee Calculator", "url": BASE + "/"}
              d = {"@context": "https://schema.org", "@type": "Article", "headline": title, "description": desc,
                   "mainEntityOfPage": BASE + "/" + slug, "datePublished": "2026-09-24", "dateModified": today,
                   "inLanguage": "en-US", "author": org, "publisher": org}
              s = '<script type="application/ld+json">' + json.dumps(d, ensure_ascii=False, separators=(",", ":")) + "</script>"
              json.loads(s[s.index(">") + 1:-9])
              open(f, "w", encoding="utf-8").write(h.replace("</head>", s + "</head>", 1))
              print("added to", f)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to change"; else git commit -m "Add Article schema to guide pages" && git push; fi
