name: Package batch 1 (educational pages)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run packaging script
        run: python package_batch1.py
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: updated-site
          path: reseller-fee-calculator-updated-*.zip
          retention-days: 30
      - name: Commit new files back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add methodology.html reseller-fee-glossary.html how-to-price-for-resale.html about.html llms.txt sitemap.xml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add educational pages: methodology, glossary, pricing guide, about"
            git push
          fi
