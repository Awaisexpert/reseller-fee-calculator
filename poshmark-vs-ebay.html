</head><body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between"><main class="max-w-4xl mx-auto px-4 py-8 flex-grow"><header class="text-center mb-8"><a href="index.html" class="text-indigo-700 font-semibold">← Back to Home</a><h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 mt-4">Poshmark vs eBay Fee Comparison</h1><p class="text-slate-600 mt-2">Compare margins side-by-side across both marketplaces.</p></header><section class="bg-white rounded-xl shadow-md p-6 border border-slate-200"><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div><label for="salePrice">Selling Price ($)</label><input type="number" id="salePrice" placeholder="50.00" step="0.01"></div><div><label for="itemCost">Item Cost ($)</label><input type="number" id="itemCost" placeholder="10.00" step="0.01"></div><div><label for="sellerShipping">Seller Shipping ($)</label><input type="number" id="sellerShipping" placeholder="5.00" step="0.01"></div><div><label for="buyerShipping">Buyer Paid Shipping ($)</label><input type="number" id="buyerShipping" placeholder="0.00" step="0.01"></div></div></section><section class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-6" id="results"></section></main><footer class="bg-white border-t border-slate-200 py-8 mt-12 text-center text-xs text-slate-500"><p>&copy; 2026 Reseller Fee Calculator</p></footer><script>const fees={poshmark:{feeRate:.20,shippingCost:0},ebay:{feeRate:.1325,shippingCost:.30}};function calculate(){const salePrice=+document.getElementById('salePrice').value||0;const itemCost=+document.getElementById('itemCost').value||0;const sellerShipping=+document.getElementById('sellerShipping').value||0;const buyerShipping=+document.getElementById('buyerShipping').value||0;const results=[];for(const [name,{feeRate,shippingCost}] of Object.entries(fees)){const fee=salePrice*feeRate+shippingCost;const net=salePrice-fee-sellerShipping+buyerShipping;const profit=net-itemCost-sellerShipping;results.push(`<div class='
