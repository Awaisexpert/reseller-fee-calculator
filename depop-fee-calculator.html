</head><body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between"><main class="max-w-4xl mx-auto px-4 py-8 flex-grow"><header class="text-center mb-8"><a href="index.html" class="text-indigo-700 font-semibold">← Back to Home</a><h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 mt-4">Depop Fee Calculator</h1><p class="text-slate-600 mt-2">Estimate your payout after Depop seller fees.</p></header><section class="bg-white rounded-xl shadow-md p-6 border border-slate-200"><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div><label for="salePrice">Selling Price ($)</label><input type="number" id="salePrice" placeholder="50.00" step="0.01"></div><div><label for="itemCost">Item Cost ($)</label><input type="number" id="itemCost" placeholder="10.00" step="0.01"></div><div><label for="sellerShipping">Seller Shipping ($)</label><input type="number" id="sellerShipping" placeholder="5.00" step="0.01"></div><div><label for="buyerShipping">Buyer Paid Shipping ($)</label><input type="number" id="buyerShipping" placeholder="0.00" step="0.01"></div></div></section><section class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-6" id="results"></section></main><footer class="bg-white border-t border-slate-200 py-8 mt-12 text-center text-xs text-slate-500"><p>&copy; 2026 Reseller Fee Calculator</p></footer><script>const feeRate=.10;function calculate(){const salePrice=+document.getElementById('salePrice').value||0;const itemCost=+document.getElementById('itemCost').value||0;const sellerShipping=+document.getElementById('sellerShipping').value||0;const buyerShipping=+document.getElementById('buyerShipping').value||0;const fee=salePrice*feeRate;const net=salePrice-fee-sellerShipping+buyerShipping;const profit=net-itemCost-sellerShipping;document.getElementById('results').innerHTML=`<div class='bg-slate-50 rounded-xl p-5 border border-slate-200'><h2 class='text-xl font-bold text-slate-900 mb-3'>Fee Summary</h2><p class='text-sm text-slate-600'>Depop fee: <span class='font-semibold text-slate-800'>$${fee.toFixed(2)}</span></p><p class='text-sm text-slate-600'>Net payout: <span class='font-semibold text-slate-800'>$${net.toFixed(2)}</span></p><p class='text-sm text-slate-600'>Profit: <span class='font-semibold text-slate-800'>$${profit.toFixed(2)}</span></p></div>`;}['salePrice','itemCost','sellerShipping','buyerShipping'].forEach(id=>document.getElementById(id).addEventListener('input',calculate));calculate();</script></body></html>
